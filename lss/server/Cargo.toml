[package]
name = "lss-server"
version = "0.1.0"
description = "Last Server Standing: flash-sale API server"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The library holds all the code so integration tests in tests/ can build the app
# in-process; main.rs is a thin binary on top of it.
[lib]
name = "lss_server"
path = "src/lib.rs"

[[bin]]
name = "lss-server"
path = "src/main.rs"

[dependencies]
actix-web = { version = "4.20.0", default-features = false, features = ["macros", "unicode"] }
form_urlencoded = "1.2.2"
mimalloc = "0.1.52"
parking_lot = "0.13.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "ansi", "std"] }

[dev-dependencies]
actix-http = { version = "3.22.0", default-features = false }
tempfile = "3.27.0"
