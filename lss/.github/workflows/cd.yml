# CD: on every push to main (or a manual run), run CI, then deploy the exact
# binary CI built to the box, after a human approves the `production`
# environment.
#
# Only works BEFORE code freeze: after that SSH to the box is closed and this
# job will fail at the first ssh/scp. That is expected.
#
# Required (Settings -> Environments -> production):
#   secrets SSH_HOST (box public IP or DNS), SSH_USER (ubuntu), SSH_KEY (the
#   private key, PEM contents); required reviewers = you.
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to box
    needs: ci
    # A manual run from another branch must not deploy it.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    # Never two deploys at once; queue instead of cancelling a half-done deploy.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: lss-server
          path: dist

      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lss_deploy
          chmod 600 ~/.ssh/lss_deploy

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          chmod +x dist/lss-server
          export SSH_KEY_FILE="$HOME/.ssh/lss_deploy"
          RELEASE_NAME="${GITHUB_SHA::7}" deploy/deploy.sh "$SSH_USER@$SSH_HOST" dist/lss-server

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/lss_deploy
